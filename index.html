<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FIKIH X – Learning Platform</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --emerald:#059669;
  --emerald-dark:#047857;
  --green-dark:#064e3b;
  --green-deep:#022c22;
  --green-light:#ecfdf5;
  --mint:#d1fae5;
  --mint-soft:#f0fdf4;
  --white:#ffffff;
  --gray-50:#f9fafb;
  --gray-100:#f3f4f6;
  --gray-200:#e5e7eb;
  --gray-500:#6b7280;
  --gray-600:#4b5563;
  --gray-700:#374151;
  --gray-800:#1f2937;
  --amber:#f59e0b;
  --amber-light:#fef3c7;
  --red:#dc2626;
  --red-light:#fef2f2;
  --blue:#2563eb;
  --shadow-sm:0 1px 3px rgba(6,78,59,.08);
  --shadow:0 10px 30px rgba(6,78,59,.10);
  --shadow-lg:0 20px 50px rgba(6,78,59,.14);
  --radius:16px;
  --radius-sm:10px;
  --transition:.25s cubic-bezier(.4,0,.2,1);
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  font-family:'Poppins','Inter',system-ui,-apple-system,sans-serif;
  background:var(--gray-50);
  color:var(--gray-800);
  line-height:1.7;
  -webkit-font-smoothing:antialiased;
}
button{font-family:inherit;cursor:pointer;border:none;background:none}
a{text-decoration:none;color:inherit}
.container{width:100%;max-width:1180px;margin:0 auto;padding:0 20px}

@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}

/* ============ NAVBAR ============ */
.navbar{
  position:sticky;top:0;z-index:1000;
  background:rgba(255,255,255,.94);
  backdrop-filter:blur(14px);
  border-bottom:1px solid var(--gray-200);
}
.navbar .container{
  display:flex;align-items:center;justify-content:space-between;height:72px;
}
.brand{display:flex;align-items:center;gap:12px}
.brand-icon{
  width:44px;height:44px;border-radius:12px;
  background:linear-gradient(135deg,var(--emerald),var(--green-dark));
  display:grid;place-items:center;color:#fff;font-size:22px;
  box-shadow:0 6px 16px rgba(5,150,105,.35);
}
.brand-text{display:flex;flex-direction:column;line-height:1.2}
.brand-text strong{font-size:1.05rem;font-weight:700;color:var(--green-dark)}
.brand-text span{font-size:.7rem;font-weight:500;color:var(--emerald);letter-spacing:1.6px;text-transform:uppercase}
.nav-links{display:flex;align-items:center;gap:6px;list-style:none}
.nav-links a{
  padding:9px 16px;border-radius:10px;font-size:.88rem;font-weight:500;
  color:var(--gray-600);transition:var(--transition);
}
.nav-links a:hover{background:var(--green-light);color:var(--emerald-dark)}
.nav-links a.active{background:var(--emerald);color:#fff;box-shadow:0 4px 12px rgba(5,150,105,.3)}
.menu-toggle{display:none;font-size:1.6rem;color:var(--green-dark);padding:4px 8px}

/* ============ HERO ============ */
.hero{
  background:
    radial-gradient(ellipse at 85% 15%, rgba(16,185,129,.22), transparent 55%),
    radial-gradient(ellipse at 10% 90%, rgba(5,150,105,.18), transparent 50%),
    linear-gradient(145deg,var(--green-deep) 0%,var(--green-dark) 60%,#065f46 100%);
  color:#fff;padding:70px 0 80px;position:relative;overflow:hidden;
}
.hero::before{
  content:"";position:absolute;inset:0;
  background-image:radial-gradient(rgba(255,255,255,.06) 1px,transparent 1px);
  background-size:26px 26px;pointer-events:none;
}
.hero .container{position:relative;z-index:1;display:grid;grid-template-columns:1.15fr .85fr;gap:50px;align-items:center}
.hero-badge{
  display:inline-flex;align-items:center;gap:8px;
  background:rgba(255,255,255,.10);border:1px solid rgba(255,255,255,.16);
  padding:6px 16px;border-radius:999px;font-size:.75rem;font-weight:500;
  letter-spacing:.6px;margin-bottom:22px;color:var(--mint);
}
.hero-badge .dot{width:7px;height:7px;border-radius:50%;background:#34d399;box-shadow:0 0 0 4px rgba(52,211,153,.2)}
.hero h1{font-size:clamp(2rem,4.2vw,3.2rem);font-weight:800;line-height:1.15;letter-spacing:-.8px;margin-bottom:18px}
.hero h1 .accent{color:#6ee7b7}
.hero p{font-size:1rem;color:#d1fae5;max-width:520px;margin-bottom:30px;font-weight:300}
.hero-actions{display:flex;gap:14px;flex-wrap:wrap}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:9px;
  padding:12px 26px;border-radius:12px;font-size:.9rem;font-weight:600;
  transition:var(--transition);border:2px solid transparent;
}
.btn-primary{background:var(--emerald);color:#fff;box-shadow:0 8px 22px rgba(5,150,105,.4)}
.btn-primary:hover{background:var(--emerald-dark);transform:translateY(-2px)}
.btn-outline{background:rgba(255,255,255,.06);border-color:rgba(255,255,255,.35);color:#fff}
.btn-outline:hover{background:rgba(255,255,255,.15);border-color:rgba(255,255,255,.6);transform:translateY(-2px)}
.btn-sm{padding:9px 18px;font-size:.82rem;border-radius:10px}
.btn-green{background:var(--emerald);color:#fff}
.btn-green:hover{background:var(--emerald-dark)}
.btn-ghost{background:var(--green-light);color:var(--emerald-dark)}
.btn-ghost:hover{background:var(--mint)}
.btn-red{background:var(--red);color:#fff}
.btn-red:hover{background:#b91c1c}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none!important}

.hero-stats{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.stat-card{
  background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);
  border-radius:var(--radius);padding:22px 20px;text-align:center;
  backdrop-filter:blur(8px);transition:var(--transition);
}
.stat-card:hover{background:rgba(255,255,255,.13);transform:translateY(-3px)}
.stat-card .num{font-size:1.9rem;font-weight:800;color:#6ee7b7;line-height:1.1}
.stat-card .lbl{font-size:.72rem;color:#d1fae5;letter-spacing:.4px;margin-top:4px}
.stat-card.wide{grid-column:1/-1}
.stat-card.wide .num{font-size:1.35rem}

/* ============ SECTIONS ============ */
.section{padding:70px 0}
.section-alt{background:var(--white)}
.section-head{text-align:center;max-width:640px;margin:0 auto 46px}
.section-head .tag{
  display:inline-block;font-size:.7rem;font-weight:700;letter-spacing:2px;
  text-transform:uppercase;color:var(--emerald);background:var(--green-light);
  padding:5px 14px;border-radius:999px;margin-bottom:14px;
}
.section-head h2{font-size:clamp(1.6rem,3vw,2.2rem);font-weight:800;color:var(--green-dark);letter-spacing:-.5px;margin-bottom:10px}
.section-head p{color:var(--gray-500);font-size:.94rem}

/* ============ MATERI ============ */
.materi-grid{display:flex;flex-direction:column;gap:18px}
.materi-card{
  background:var(--white);border-radius:var(--radius);box-shadow:var(--shadow-sm);
  border:1px solid var(--gray-200);overflow:hidden;transition:var(--transition);
  animation:fadeUp .5s ease both;
}
.materi-card:hover{box-shadow:var(--shadow);border-color:var(--mint)}
.materi-card.open{box-shadow:var(--shadow);border-color:var(--emerald)}
.materi-header{
  display:flex;align-items:center;gap:16px;padding:22px 24px;cursor:pointer;
  user-select:none;transition:var(--transition);
}
.materi-header:hover{background:var(--green-light)}
.materi-icon{
  width:52px;height:52px;border-radius:14px;flex-shrink:0;
  background:linear-gradient(135deg,var(--green-light),var(--mint));
  display:grid;place-items:center;font-size:25px;
}
.materi-meta{flex:1;min-width:0}
.materi-meta .bab{font-size:.68rem;font-weight:700;letter-spacing:1.6px;text-transform:uppercase;color:var(--emerald);margin-bottom:2px}
.materi-meta h3{font-size:1.08rem;font-weight:700;color:var(--green-dark);line-height:1.3}
.materi-meta p{font-size:.8rem;color:var(--gray-500);margin-top:2px}
.materi-chevron{
  width:34px;height:34px;border-radius:50%;background:var(--green-light);
  display:grid;place-items:center;color:var(--emerald-dark);font-size:.9rem;
  transition:var(--transition);flex-shrink:0;
}
.materi-card.open .materi-chevron{transform:rotate(180deg);background:var(--emerald);color:#fff}
.materi-body{display:none;padding:0 24px 26px;border-top:1px solid var(--gray-100)}
.materi-card.open .materi-body{display:block;animation:fadeIn .35s ease}

.accordion-item{border-bottom:1px solid var(--gray-100)}
.accordion-item:last-child{border-bottom:none}
.accordion-btn{
  width:100%;display:flex;align-items:center;justify-content:space-between;
  gap:12px;padding:15px 0;text-align:left;font-size:.9rem;font-weight:600;
  color:var(--gray-700);transition:var(--transition);
}
.accordion-btn:hover{color:var(--emerald-dark)}
.accordion-btn .sign{
  width:26px;height:26px;border-radius:8px;background:var(--green-light);
  display:grid;place-items:center;font-size:1rem;color:var(--emerald);
  transition:var(--transition);flex-shrink:0;
}
.accordion-item.open .accordion-btn{color:var(--emerald-dark)}
.accordion-item.open .accordion-btn .sign{background:var(--emerald);color:#fff;transform:rotate(45deg)}
.accordion-content{display:none;padding:0 0 16px;font-size:.88rem;color:var(--gray-600)}
.accordion-item.open .accordion-content{display:block;animation:fadeIn .3s ease}
.accordion-content p{margin-bottom:10px}
.accordion-content ul,.accordion-content ol{margin:8px 0 12px 20px}
.accordion-content li{margin-bottom:5px}
.accordion-content strong{color:var(--green-dark);font-weight:600}
.dalil{
  background:linear-gradient(135deg,var(--mint-soft),var(--green-light));
  border-left:4px solid var(--emerald);border-radius:0 10px 10px 0;
  padding:14px 18px;margin:12px 0;font-size:.86rem;color:var(--green-dark);
}
.dalil .terjemah{font-style:italic;color:var(--gray-600);font-size:.83rem}
.dalil .sumber{display:block;margin-top:5px;font-size:.75rem;font-weight:600;color:var(--emerald-dark);font-style:normal}

/* ============ LATIHAN / PAKET ============ */
.paket-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:22px}
.paket-card{
  background:var(--white);border-radius:var(--radius);padding:30px 26px;
  border:1px solid var(--gray-200);box-shadow:var(--shadow-sm);
  transition:var(--transition);position:relative;overflow:hidden;
  display:flex;flex-direction:column;
}
.paket-card::before{
  content:"";position:absolute;top:0;left:0;right:0;height:5px;
  background:linear-gradient(90deg,var(--emerald),#34d399);
}
.paket-card:hover{transform:translateY(-6px);box-shadow:var(--shadow-lg);border-color:var(--mint)}
.paket-num{
  width:54px;height:54px;border-radius:16px;display:grid;place-items:center;
  font-size:1.3rem;font-weight:800;color:#fff;margin-bottom:18px;
  background:linear-gradient(135deg,var(--emerald),var(--green-dark));
  box-shadow:0 8px 20px rgba(5,150,105,.3);
}
.paket-card h3{font-size:1.12rem;font-weight:700;color:var(--green-dark);margin-bottom:6px}
.paket-card .desc{font-size:.83rem;color:var(--gray-500);margin-bottom:16px;flex:1}
.paket-info{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:20px}
.paket-info span{
  font-size:.72rem;font-weight:600;padding:4px 11px;border-radius:999px;
  background:var(--green-light);color:var(--emerald-dark);
}
.paket-card .btn{width:100%}

/* ============ EXAM ============ */
.exam-wrap{display:none}
.exam-wrap.active{display:block;animation:fadeIn .4s ease}
.exam-topbar{
  display:flex;align-items:center;justify-content:space-between;gap:16px;
  background:var(--white);border:1px solid var(--gray-200);border-radius:var(--radius);
  padding:18px 22px;margin-bottom:18px;box-shadow:var(--shadow-sm);flex-wrap:wrap;
}
.exam-title{display:flex;align-items:center;gap:14px}
.exam-title .icon{
  width:46px;height:46px;border-radius:12px;background:var(--green-light);
  display:grid;place-items:center;font-size:22px;
}
.exam-title h3{font-size:1rem;font-weight:700;color:var(--green-dark);line-height:1.2}
.exam-title p{font-size:.76rem;color:var(--gray-500)}
.exam-progress-wrap{flex:1;min-width:160px;max-width:340px}
.progress-label{display:flex;justify-content:space-between;font-size:.72rem;font-weight:600;color:var(--gray-500);margin-bottom:6px}
.progress-label b{color:var(--emerald-dark)}
.progress-track{height:9px;background:var(--gray-100);border-radius:999px;overflow:hidden}
.progress-fill{height:100%;width:0%;border-radius:999px;background:linear-gradient(90deg,var(--emerald),#34d399);transition:width .4s ease}

.exam-layout{display:grid;grid-template-columns:1fr 300px;gap:20px;align-items:start}
.question-card{
  background:var(--white);border:1px solid var(--gray-200);border-radius:var(--radius);
  padding:28px;box-shadow:var(--shadow-sm);
}
.question-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px;flex-wrap:wrap}
.q-badge{
  display:inline-flex;align-items:center;gap:8px;background:var(--green-dark);color:#fff;
  padding:6px 14px;border-radius:999px;font-size:.74rem;font-weight:600;
}
.q-badge .num{background:var(--emerald);min-width:24px;height:24px;padding:0 6px;border-radius:999px;display:grid;place-items:center;font-size:.7rem}
.q-chapter{font-size:.72rem;font-weight:600;color:var(--emerald-dark);background:var(--green-light);padding:5px 12px;border-radius:999px}
.question-text{font-size:1rem;font-weight:500;color:var(--gray-800);margin-bottom:20px;line-height:1.65}
.options{display:flex;flex-direction:column;gap:10px;margin-bottom:24px}
.option{
  display:flex;align-items:flex-start;gap:12px;padding:13px 16px;
  border:1.5px solid var(--gray-200);border-radius:12px;cursor:pointer;
  transition:var(--transition);background:var(--white);text-align:left;width:100%;
}
.option:hover{border-color:var(--emerald);background:var(--mint-soft)}
.option.selected{border-color:var(--emerald);background:var(--green-light);box-shadow:0 0 0 3px rgba(5,150,105,.08)}
.option-letter{
  width:28px;height:28px;border-radius:8px;flex-shrink:0;display:grid;place-items:center;
  font-size:.78rem;font-weight:700;background:var(--gray-100);color:var(--gray-600);
  transition:var(--transition);
}
.option.selected .option-letter{background:var(--emerald);color:#fff}
.option-text{font-size:.88rem;color:var(--gray-700);line-height:1.55;padding-top:2px}
.question-nav{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.nav-buttons{display:flex;gap:8px}
.btn-nav{
  padding:10px 20px;border-radius:10px;font-size:.82rem;font-weight:600;
  background:var(--green-light);color:var(--emerald-dark);transition:var(--transition);
}
.btn-nav:hover:not(:disabled){background:var(--mint)}
.btn-nav:disabled{opacity:.4;cursor:not-allowed}

/* side panel */
.exam-side{
  background:var(--white);border:1px solid var(--gray-200);border-radius:var(--radius);
  padding:20px;box-shadow:var(--shadow-sm);position:sticky;top:88px;
}
.exam-side h4{font-size:.82rem;font-weight:700;color:var(--green-dark);margin-bottom:12px;display:flex;align-items:center;gap:7px}
.nav-grid{
  display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-bottom:16px;
  max-height:260px;overflow-y:auto;padding-right:4px;
}
.nav-num{
  aspect-ratio:1;border-radius:8px;display:grid;place-items:center;
  font-size:.74rem;font-weight:700;background:var(--gray-100);color:var(--gray-500);
  border:1.5px solid transparent;transition:var(--transition);
}
.nav-num:hover{border-color:var(--emerald);color:var(--emerald-dark)}
.nav-num.answered{background:var(--mint);color:var(--emerald-dark);border-color:var(--mint)}
.nav-num.current{background:var(--emerald);color:#fff;border-color:var(--emerald-dark);box-shadow:0 3px 10px rgba(5,150,105,.3)}
.legend{display:flex;flex-direction:column;gap:6px;font-size:.7rem;color:var(--gray-500);margin-bottom:16px}
.legend span{display:flex;align-items:center;gap:7px}
.legend i{width:13px;height:13px;border-radius:4px;display:inline-block}
.legend .l-current{background:var(--emerald)}
.legend .l-answered{background:var(--mint);border:1px solid #a7f3d0}
.legend .l-empty{background:var(--gray-100);border:1px solid var(--gray-200)}
.side-summary{background:var(--green-light);border-radius:10px;padding:12px;font-size:.75rem;color:var(--green-dark);margin-bottom:14px}
.side-summary div{display:flex;justify-content:space-between;margin-bottom:4px}
.side-summary div:last-child{margin-bottom:0}
.side-summary b{font-weight:700}
.btn-submit{width:100%;padding:13px;border-radius:11px;background:var(--green-dark);color:#fff;font-weight:700;font-size:.85rem;transition:var(--transition);display:flex;align-items:center;justify-content:center;gap:8px}
.btn-submit:hover{background:var(--emerald-dark);transform:translateY(-1px)}

/* ============ RESULT ============ */
.result-wrap{display:none}
.result-wrap.active{display:block;animation:fadeIn .5s ease}
.result-hero{
  background:linear-gradient(145deg,var(--green-deep),var(--green-dark));
  border-radius:var(--radius);padding:40px 30px;color:#fff;text-align:center;
  position:relative;overflow:hidden;margin-bottom:24px;
}
.result-hero .inner{position:relative;z-index:1}
.result-hero h3{font-size:1.25rem;font-weight:700;margin-bottom:4px}
.result-hero p{font-size:.85rem;color:#d1fae5;margin-bottom:26px}
.score-ring{
  width:150px;height:150px;border-radius:50%;margin:0 auto 16px;
  display:grid;place-items:center;position:relative;
  background:conic-gradient(#34d399 0deg,#34d399 var(--score-deg,0deg),rgba(255,255,255,.15) var(--score-deg,0deg));
}
.score-ring::before{content:"";position:absolute;inset:10px;border-radius:50%;background:var(--green-dark)}
.score-ring .score-inner{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center}
.score-ring .score-val{font-size:2.4rem;font-weight:800;color:#6ee7b7;line-height:1}
.score-ring .score-lbl{font-size:.65rem;color:#a7f3d0;letter-spacing:1px;text-transform:uppercase;margin-top:4px}
.result-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;max-width:440px;margin:0 auto}
.res-stat{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.15);border-radius:12px;padding:14px 10px}
.res-stat .n{font-size:1.4rem;font-weight:800;line-height:1.1}
.res-stat .l{font-size:.68rem;color:#d1fae5;letter-spacing:.4px;margin-top:2px}
.res-stat.correct .n{color:#6ee7b7}
.res-stat.wrong .n{color:#fca5a5}
.res-stat.empty .n{color:#fcd34d}
.result-actions{display:flex;gap:12px;justify-content:center;margin-top:26px;flex-wrap:wrap}

.review-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:28px 0 16px;flex-wrap:wrap}
.review-head h3{font-size:1.05rem;font-weight:700;color:var(--green-dark)}
.filter-btns{display:flex;gap:8px;flex-wrap:wrap}
.review-list{display:flex;flex-direction:column;gap:14px}
.review-item{
  background:var(--white);border:1px solid var(--gray-200);border-radius:var(--radius-sm);
  padding:20px 22px;box-shadow:var(--shadow-sm);
}
.review-item.correct{border-left:5px solid var(--emerald)}
.review-item.wrong{border-left:5px solid var(--red)}
.review-item.empty{border-left:5px solid var(--amber)}
.review-top{display:flex;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.review-num{
  padding:3px 10px;border-radius:8px;font-size:.75rem;font-weight:700;
  background:var(--green-light);color:var(--emerald-dark);
}
.review-status{font-size:.68rem;font-weight:700;padding:3px 10px;border-radius:999px}
.review-status.c{background:var(--mint);color:var(--emerald-dark)}
.review-status.w{background:var(--red-light);color:var(--red)}
.review-status.e{background:var(--amber-light);color:#b45309}
.review-q{font-size:.92rem;font-weight:600;color:var(--gray-800);margin-bottom:10px}
.review-ans{font-size:.83rem;color:var(--gray-600);margin-bottom:8px;display:flex;flex-direction:column;gap:4px}
.review-exp{
  background:var(--mint-soft);border-radius:8px;padding:10px 14px;
  font-size:.82rem;color:var(--green-dark);border-left:3px solid var(--emerald);
}

footer{
  background:var(--green-deep);color:#a7f3d0;text-align:center;
  padding:32px 20px;font-size:.82rem;margin-top:40px;
}

@media(max-width:900px){
  .hero .container,.exam-layout{grid-template-column
